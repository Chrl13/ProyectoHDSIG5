[pytest]
testpaths = tests
markers =
    unit: Unit tests (no database, no network)
    integration: Integration tests (database + Flask test client)
    functional: Functional tests (Selenium browser automation)
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --html=reports/report.html
    --self-contained-html
    --cov=app
    --cov=models
    --cov-report=html:reports/coverage
    --cov-report=term
