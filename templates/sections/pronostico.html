{% extends "base.html" %}
{% block title %}Pronóstico{% endblock %}

{% block content %}

<h1>Pronóstico de 7 días</h1>

<p class="subtitle">
    Consulta el pronóstico extendido para cualquier ciudad del mundo.
</p>

<div class="panel">

    <div style="display:flex;gap:10px;margin-bottom:20px;">

        <input
            id="ciudadPronostico"
            type="text"
            value="San José"
            placeholder="Buscar ciudad..."
            style="flex:1;padding:10px;font-size:16px;">

        <button onclick="buscarPronostico()">
            Buscar
        </button>

    </div>

    <div id="resultadoPronostico">

        Cargando...

    </div>

</div>

<script src="{{ url_for('static', filename='js/pronostico.js') }}"></script>

{% endblock %}
