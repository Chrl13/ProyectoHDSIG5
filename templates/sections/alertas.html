{% extends "base.html" %}
{% block title %}Alertas{% endblock %}
{% block content %}
<h1>Alertas Meteorol&#243;gicas</h1>
<p class="subtitle">Alertas activas por zona geogr&#225;fica</p>

<div class="panel" style="margin-bottom:1.5rem;">
    <form class="form-row">
        <div class="form-group">
            <label>Zona</label>
            <select>
                <option>Todas</option>
                <option>Norte</option>
                <option>Sur</option>
                <option>Este</option>
                <option>Oeste</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tipo</label>
            <select>
                <option>Todas</option>
                <option>Temporal</option>
                <option>Inundaci&#243;n</option>
                <option>Sequ&#237;a</option>
                <option>Viento</option>
            </select>
        </div>
        <button type="button" class="btn btn-primary">Filtrar</button>
    </form>
</div>

<div class="panel">
    <div class="empty-state">
        <div class="icon">&#9888;</div>
        <p>No hay alertas activas en este momento</p>
    </div>
</div>
{% endblock %}
