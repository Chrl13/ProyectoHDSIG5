{% extends "base.html" %}
{% block title %}Alertas{% endblock %}

{% block content %}

<h1>⚠ Alertas Meteorológicas</h1>
<p class="subtitle">Consulta las alertas ambientales para una ciudad.</p>

<div class="panel">

    <div style="display:flex; gap:10px; margin-bottom:20px;">

        <input
            id="ciudadAlerta"
            type="text"
            value="San José"
            placeholder="Ingrese una ciudad..."
            style="flex:1;padding:10px;">

        <button onclick="cargarAlertas()">
            Buscar
        </button>

    </div>

    <div id="listaAlertas">
        <p>Cargando alertas...</p>
    </div>

</div>

<script>

async function cargarAlertas(){

    const ciudad = document.getElementById("ciudadAlerta").value;

    const r = await fetch("/api/alertas?ciudad=" + encodeURIComponent(ciudad));
    const d = await r.json();

    const contenedor = document.getElementById("listaAlertas");

    if(d.error){
        contenedor.innerHTML = "<p>" + d.error + "</p>";
        return;
    }

    let html = "";

    d.alertas.forEach(a => {

        html += `

        <div class="card" style="margin-bottom:15px;">

            <h3>${a.nivel} ${a.titulo}</h3>

            <p>${a.descripcion}</p>

        </div>

        `;

    });

    contenedor.innerHTML = html;

}

cargarAlertas();

</script>

{% endblock %}
