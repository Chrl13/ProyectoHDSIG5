<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Auth0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body class="home-body">
    <div class="home-card">
        {% if user %}
            <div class="user-info">
                <img src="{{ user.get('picture', '') }}" alt="avatar" width="64" height="64">
                <h2>{{ user.get('name', user.get('email', 'Usuario')) }}</h2>
                <small>{{ user.get('email', '') }}</small>
            </div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Ir al Dashboard</a>
        {% else %}
            <h1>ClimApp</h1>
            <p>Sistema de Riesgo Ambiental<br><small style="color:var(--text-muted)">Login con email/password + OTP</small></p>
            <a href="{{ url_for('login') }}" class="btn btn-primary">Iniciar Sesi&#243;n</a>
        {% endif %}
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.home-card');
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px) scale(0.96)';
                card.style.transition = 'opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0) scale(1)';
                    });
                });
            }
        });
    </script>
</body>
</html>
